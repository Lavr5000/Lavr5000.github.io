<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Vibes — AI-продукты для стройки</title>
<meta name="description" content="Прайс-каталог AI-сервисов для ПТО, сметчиков и снабжения: загрузил рабочую документацию — получил готовый Excel." />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="AI Vibes" />
<meta property="og:title" content="AI Vibes — AI-продукты для стройки" />
<meta property="og:description" content="Прайс-каталог AI-сервисов для ПТО, сметчиков и снабжения: загрузил документацию — получил готовый Excel." />
<meta property="og:url" content="https://lavr5000.github.io/products.html" />
<link rel="icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#08080B; --bg-elev:#0D0D11; --bg-card:#101015; --bg-card-hover:#14141B;
    --border:#1C1C24; --border-strong:#25252F;
    --text:#EDEDEF; --text-2:#A1A1AA; --text-3:#6B6B75;
    --accent:#FF6B35; --accent-2:#FF9770; --accent-soft:rgba(255,107,53,0.12); --accent-glow:rgba(255,107,53,0.35);
    --green:#7DD87D; --amber:#F5B94F; --red:#F87171;
    --radius:10px; --radius-lg:16px; --container:1180px;
    --ease:cubic-bezier(0.22,0.61,0.36,1);
    --font-sans:'Inter',system-ui,-apple-system,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body {
    background:var(--bg); color:var(--text);
    font-family:var(--font-sans); font-size:16px; line-height:1.55;
    letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  ::selection { background:var(--accent-glow); color:#fff; }
  a { color:inherit; text-decoration:none; }
  .container { max-width:var(--container); margin:0 auto; padding:0 24px; }
  .mono { font-family:var(--font-mono); }

  /* ---- Nav ---- */
  .nav {
    position:sticky; top:0; z-index:50;
    background:rgba(8,8,11,0.72); backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    border-bottom:1px solid var(--border);
  }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo { display:flex; align-items:center; gap:9px; font-weight:600; font-size:16px; letter-spacing:-0.02em; }
  .logo-mark {
    width:26px; height:26px; border-radius:7px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid; place-items:center; flex:none;
    box-shadow:0 0 16px var(--accent-glow);
  }
  .logo-mark svg { width:15px; height:15px; }
  .nav-right { display:flex; align-items:center; gap:6px; }
  .nav-link {
    font-size:14px; color:var(--text-2); padding:7px 12px; border-radius:var(--radius);
    transition:color .2s var(--ease), background .2s var(--ease);
  }
  .nav-link:hover { color:var(--text); background:var(--bg-card); }
  .nav-link.active { color:var(--text); }
  .nav-link.active::after {
    content:''; display:block; height:2px; margin-top:5px; border-radius:2px;
    background:var(--accent);
  }
  .lang-toggle {
    display:flex; align-items:center; border:1px solid var(--border-strong);
    border-radius:100px; overflow:hidden; margin-left:6px; font-family:var(--font-mono);
  }
  .lang-toggle button {
    background:none; border:none; color:var(--text-3); cursor:pointer;
    font-family:var(--font-mono); font-size:12px; font-weight:500; padding:5px 11px;
    transition:color .2s var(--ease), background .2s var(--ease);
  }
  .lang-toggle button.on { background:var(--accent-soft); color:var(--accent); }

  /* ---- Hero ---- */
  .hero { padding:74px 0 56px; position:relative; overflow:hidden; }
  .hero::before {
    content:''; position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:680px; height:380px; border-radius:50%;
    background:radial-gradient(ellipse at center, var(--accent-soft), transparent 70%);
    pointer-events:none; filter:blur(8px);
  }
  .hero-inner { position:relative; max-width:760px; }
  .eyebrow {
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:12.5px; color:var(--text-2);
    border:1px solid var(--border-strong); background:var(--bg-card);
    padding:6px 13px; border-radius:100px; margin-bottom:26px;
  }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); position:relative; flex:none; }
  .dot::after {
    content:''; position:absolute; inset:0; border-radius:50%; background:var(--accent);
    animation:pulse 2s var(--ease) infinite;
  }
  @keyframes pulse { 0%{transform:scale(1);opacity:.7;} 70%{transform:scale(3);opacity:0;} 100%{opacity:0;} }
  h1.hero-title {
    font-size:clamp(32px,5.2vw,52px); line-height:1.04; font-weight:700;
    letter-spacing:-0.03em; margin-bottom:20px; text-wrap:balance;
  }
  h1.hero-title .hl { color:var(--accent); }
  .hero-sub { font-size:clamp(16px,2vw,19px); color:var(--text-2); max-width:580px; margin-bottom:32px; text-wrap:pretty; }
  .btn {
    display:inline-flex; align-items:center; gap:9px; cursor:pointer;
    font-family:var(--font-sans); font-size:15px; font-weight:500;
    padding:13px 22px; border-radius:var(--radius); border:1px solid transparent;
    transition:transform .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
  }
  .btn svg { width:16px; height:16px; transition:transform .25s var(--ease); }
  .btn-primary { background:var(--accent); color:#0A0A0A; box-shadow:0 6px 24px -6px var(--accent-glow); }
  .btn-primary:hover { background:var(--accent-2); transform:translateY(-2px); box-shadow:0 10px 32px -6px var(--accent-glow); }
  .btn-primary:hover svg { transform:translateY(3px); }

  /* ---- Section frame ---- */
  section { scroll-margin-top:80px; }
  .sec-head { margin-bottom:34px; }
  .sec-kicker {
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--accent); margin-bottom:12px; display:flex; align-items:center; gap:10px;
  }
  .sec-kicker::before { content:''; width:22px; height:1px; background:var(--accent); display:inline-block; }
  .sec-title { font-size:clamp(24px,3.4vw,32px); font-weight:700; letter-spacing:-0.025em; }
  .sec-desc { color:var(--text-2); margin-top:10px; max-width:560px; }
  .products { padding:24px 0 30px; }
  .how { padding:56px 0 70px; border-top:1px solid var(--border); }

  /* ---- Product grid ---- */
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px;
  }
  .price-card {
    position:relative; min-height:0; display:flex; flex-direction:column;
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:24px; cursor:pointer; overflow:hidden;
    transition:transform .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
  }
  .price-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:120px;
    background:radial-gradient(120% 100% at 50% 0%, var(--accent-soft), transparent 70%);
    opacity:0; transition:opacity .3s var(--ease); pointer-events:none;
  }
  .price-card:hover {
    transform:translateY(-4px); border-color:var(--accent); background:var(--bg-card-hover);
    box-shadow:0 18px 44px -16px var(--accent-glow);
  }
  .price-card:hover::before { opacity:1; }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; position:relative; }
  .card-icon {
    width:42px; height:42px; border-radius:11px; flex:none;
    border:1px solid var(--border-strong); background:var(--bg-elev);
    display:grid; place-items:center; transition:border-color .3s var(--ease), background .3s var(--ease);
  }
  .card-icon svg { width:21px; height:21px; stroke:var(--accent); }
  .price-card:hover .card-icon { border-color:var(--accent); background:var(--accent-soft); }
  .pill {
    font-family:var(--font-mono); font-size:11px; font-weight:500; padding:3px 8px;
    border-radius:100px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    border:1px solid transparent;
  }
  .pill::before { content:''; width:6px; height:6px; border-radius:50%; flex:none; }
  .pill.available { color:var(--green); background:rgba(125,216,125,0.10); border-color:rgba(125,216,125,0.25); }
  .pill.available::before { background:var(--green); }
  .pill.soon { color:var(--amber); background:rgba(245,185,79,0.10); border-color:rgba(245,185,79,0.25); }
  .pill.soon::before { background:var(--amber); }
  .pill.dev { color:var(--accent); background:var(--accent-soft); border-color:rgba(255,107,53,0.28); }
  .pill.dev::before { background:var(--accent); box-shadow:0 0 0 0 var(--accent-glow); animation:pillpulse 1.8s var(--ease) infinite; }
  @keyframes pillpulse { 0%{box-shadow:0 0 0 0 var(--accent-glow);} 70%{box-shadow:0 0 0 6px transparent;} 100%{box-shadow:0 0 0 0 transparent;} }
  .pill.planned { color:var(--text-3); background:rgba(107,107,117,0.10); border-color:var(--border-strong); }
  .pill.planned::before { background:var(--text-3); }

  .card-audience {
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--text-3); margin-bottom:12px;
  }
  .card-title { font-size:19px; font-weight:600; letter-spacing:-0.02em; margin-bottom:7px; line-height:1.25; }
  .card-tagline { font-size:14.5px; color:var(--text-2); margin-bottom:18px; text-wrap:pretty; }

  .io {
    border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-elev);
    padding:13px 14px; margin-bottom:20px; display:flex; flex-direction:column; gap:9px;
  }
  .io-row { display:flex; align-items:baseline; gap:9px; font-family:var(--font-mono); font-size:12px; line-height:1.4; }
  .io-label { color:var(--text-3); flex:none; }
  .io-val { color:var(--text-2); }
  .io-arrow { display:flex; align-items:center; gap:8px; color:var(--accent); }
  .io-arrow svg { width:13px; height:13px; flex:none; }
  .io-arrow .line { flex:1; height:1px; background:linear-gradient(90deg,var(--accent),transparent); }

  .card-foot { margin-top:auto; }
  .price { display:flex; align-items:baseline; gap:6px; margin-bottom:16px; }
  .price-from { font-family:var(--font-mono); font-size:12px; color:var(--text-3); align-self:center; }
  .price-num { font-size:30px; font-weight:500; letter-spacing:-0.02em; line-height:1; }
  .price-cur { font-size:18px; color:var(--text-3); font-weight:400; }
  .card-cta {
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-size:14px; font-weight:500; padding:11px 16px; border-radius:var(--radius);
    border:1px solid var(--border-strong); background:var(--bg-elev); color:var(--text);
    transition:background .3s var(--ease), border-color .3s var(--ease), color .25s var(--ease);
  }
  .card-cta svg { width:15px; height:15px; transition:transform .25s var(--ease); }
  .price-card:hover .card-cta { background:var(--accent); border-color:var(--accent); color:#0A0A0A; }
  .price-card:hover .card-cta svg { transform:translateX(4px); }

  /* ---- Demo table ---- */
  .demo { padding:56px 0 12px; border-top:1px solid var(--border); }
  .demo-table-wrap { overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg-card); }
  table.demo-table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:640px; }
  .demo-table th { font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); text-align:left; padding:12px 14px; border-bottom:1px solid var(--border-strong); white-space:nowrap; }
  .demo-table td { padding:10px 14px; border-bottom:1px solid var(--border); color:var(--text-2); }
  .demo-table tr:last-child td { border-bottom:none; }
  .demo-table .num { font-family:var(--font-mono); white-space:nowrap; }
  .st { font-family:var(--font-mono); font-size:11px; padding:2px 8px; border-radius:100px; white-space:nowrap; }
  .st.ok { color:var(--green); background:rgba(125,216,125,.10); }
  .st.pivot { color:var(--amber); background:rgba(245,185,79,.10); }
  .demo-note { font-family:var(--font-mono); font-size:12px; color:var(--text-3); margin-top:14px; max-width:680px; line-height:1.6; }

  /* ---- How to order ---- */
  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:26px; }
  .step { min-height:0; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg-card); padding:24px; }
  .step-num { font-family:var(--font-mono); font-size:30px; font-weight:600; color:var(--accent); line-height:1; margin-bottom:16px; }
  .step-title { font-size:16px; font-weight:600; margin-bottom:7px; letter-spacing:-0.01em; }
  .step-text { font-size:14px; color:var(--text-2); text-wrap:pretty; }
  .note {
    font-family:var(--font-mono); font-size:12.5px; color:var(--text-3); line-height:1.6;
    border-left:2px solid var(--border-strong); padding-left:16px; max-width:680px;
  }

  /* ---- Footer ---- */
  .footer { border-top:1px solid var(--border); background:var(--bg-elev); padding:44px 0 40px; }
  .footer-grid { display:flex; flex-wrap:wrap; gap:28px; justify-content:space-between; align-items:flex-start; }
  .footer-brand { display:flex; flex-direction:column; gap:10px; max-width:300px; }
  .footer-tag { font-size:13.5px; color:var(--text-3); }
  .footer-cols { display:flex; gap:64px; flex-wrap:wrap; }
  .footer-col h4 { font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:14px; font-weight:500; }
  .footer-col a, .footer-col span { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2); margin-bottom:10px; transition:color .2s var(--ease); }
  .footer-col a:hover { color:var(--accent); }
  .footer-col a svg { width:14px; height:14px; stroke:currentColor; flex:none; }
  .footer-bottom { margin-top:36px; padding-top:24px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center; }
  .footer-bottom .copy { font-family:var(--font-mono); font-size:12px; color:var(--text-3); }
  .back-link { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2); transition:color .2s var(--ease), gap .2s var(--ease); }
  .back-link:hover { color:var(--accent); gap:11px; }
  .back-link svg { width:15px; height:15px; }

  @media (max-width:720px) {
    .steps { grid-template-columns:1fr; }
    .nav-link.contacts { display:none; }
    .hero { padding:48px 0 40px; }
    .footer-cols { gap:40px; }
  }
  @media (prefers-reduced-motion:reduce) {
    * { animation:none !important; transition-duration:.01ms !important; }
    html { scroll-behavior:auto; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<!-- Product registry (single source of truth). Loaded BEFORE the app so window.AI_PRODUCTS exists. -->
<script src="products.js"></script>

<!-- App logic precompiled from JSX (babel preset-react, build 2026-06-10). -->
<script src="products.app.js"></script>
</body>
</html>
