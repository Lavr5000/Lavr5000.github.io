  .nav-inner { display:flex; align-items:center; justify-content:space-between; height:64px; }

  .logo-mark {

  .nav-link:hover { color:var(--text); background:var(--bg-card); }
  .nav-link.active { color:var(--text); }

  .lang-toggle {

  .step { min-height:0; border:1px solid var(--border); border-radius:var(--radius-lg); background:var(--bg-card); padding:24px; }
  .step-num { font-family:var(--font-mono); font-size:30px; font-weight:600; color:var(--accent); line-height:1; margin-bottom:16px; }
  .step-title { font-size:16px; font-weight:600; margin-bottom:7px; letter-spacing:-0.01em; }

  .footer-tag { font-size:13.5px; color:var(--text-3); }
  .footer-cols { display:flex; gap:64px; flex-wrap:wrap; }

  .footer-bottom { margin-top:36px; padding-top:24px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center; }
  .footer-bottom .copy { font-family:var(--font-mono); font-size:12px; color:var(--text-3); }
  .back-link { display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--text-2); transition:color .2s var(--ease), gap .2s var(--ease); }
  .back-link:hover { color:var(--accent); gap:11px; }
  .back-link svg { width:15px; height:15px; }

  @media (max-width:720px) {
    .steps { grid-template-columns:1fr; }
    .nav-link.contacts { display:none; }
    .hero { padding:48px 0 40px; }
    .footer-cols { gap:40px; }
  }
  @media (prefers-reduced-motion:reduce) {
    * { animation:none !important; transition-duration:.01ms !important; }
    html { scroll-behavior:auto; }
  }
</style>

const ICON_KEYS = ["list","diff","mail","mic","spark"];

function pick(o, lang) { return (o && (o[lang] != null ? o[lang] : o.ru)) || ""; }

function getProducts(lang) {
  const raw = Array.isArray(window.AI_PRODUCTS) ? window.AI_PRODUCTS : [];
  return raw
    .filter(p => p && p.id && p.title && p.title.ru && p.price && p.price.ru && p.visible !== false)
    .slice()
    .sort((a,b) => (a.order != null ? a.order : 999) - (b.order != null ? b.order : 999))
    .map(p => {
      const tgText = p.cta && p.cta.tgText ? pick(p.cta.tgText, lang) : "";
      return {
        key: p.id,
        icon: ICON_KEYS.includes(p.icon) ? p.icon : "list",
        status: STATUSES.includes(p.status) ? p.status : "planned",
        aud: pick(p.audience, lang),
        title: pick(p.title, lang),
        tag: pick(p.tagline, lang),
        in: pick(p.input, lang),
        out: pick(p.output, lang),
        price: pick(p.price, lang),
        href: TG + (tgText ? ("?text=" + encodeURIComponent(tgText)) : ""),
      };
    });
}

/* ---------- Components ---------- */
function Nav({ lang, setLang, t }) {
  return (
    <nav className="nav">
      <div className="container nav-inner">
        <a className="logo" href={PORTFOLIO}>
          <span className="logo-mark">{ico.spark}</span>
          <span>AI&nbsp;Vibes</span>
        </a>
        <div className="nav-right">
          <a className="nav-link" href={PORTFOLIO}>{t.nav.portfolio}</a>
          <a className="nav-link active" href="#products">{t.nav.products}</a>
          <a className="nav-link contacts" href="#footer">{t.nav.contacts}</a>
          <div className="lang-toggle" role="group" aria-label="Language">
            <button className={lang==="ru"?"on":""} onClick={()=>setLang("ru")}>RU</button>
            <button className={lang==="en"?"on":""} onClick={()=>setLang("en")}>EN</button>
          </div>
        </div>
      </div>
    </nav>
  );
}

function Hero({ t }) {
  return (
    <header className="hero">
      <div className="container hero-inner">
        <span className="eyebrow"><span className="dot"></span>{t.hero.eyebrow}</span>
        <h1 className="hero-title">
          {t.hero.title[0]}<span className="hl">{t.hero.title[1]}</span>{t.hero.title[2]}
        </h1>
        <p className="hero-sub">{t.hero.sub}</p>
        <a className="btn btn-primary" href="#products">
          {t.hero.cta}{ico.arrowDown}
        </a>
      </div>
    </header>
  );
}

function PriceCard({ p, t }) {
  return (
    <a className="price-card" href={p.href} target="_blank" rel="noopener noreferrer">
      <div className="card-top">
        <span className="card-icon">{ico[p.icon]}</span>
        <span className={"pill "+p.status}>{t.statuses[p.status]}</span>
      </div>
      <div className="card-audience">{p.aud}</div>
      <h3 className="card-title">{p.title}</h3>
      <p className="card-tagline">{p.tag}</p>
      <div className="io">
        <div className="io-row"><span className="io-label">{t.io.in}</span><span className="io-val">{p.in}</span></div>
        <div className="io-arrow"><span className="line"></span>{ico.arrowDown}<span className="line"></span></div>
        <div className="io-row"><span className="io-label">{t.io.out}</span><span className="io-val">{p.out}</span></div>
      </div>
      <div className="card-foot">
        <div className="price">
          <span className="price-from mono">{t.from}</span>
          <span className="price-num">{Number(p.price).toLocaleString("ru-RU")}</span>
          <span className="price-cur">₽</span>
        </div>
        <span className="card-cta">{t.cardCta}{ico.arrowRight}</span>
      </div>
    </a>
  );
}

function Products({ t, lang }) {
  const list = getProducts(lang);
  return (
    <section className="products" id="products">
      <div className="container">
        <div className="sec-head">
          <div className="sec-kicker">{t.products.kicker}</div>
          <h2 className="sec-title">{t.products.title}</h2>
          <p className="sec-desc">{t.products.desc}</p>
        </div>
        <div className="grid">
          {list.length
            ? list.map(p => <PriceCard key={p.key} p={p} t={t} />)
            : <p className="sec-desc">{t.products.empty}</p>}
        </div>
      </div>
    </section>
  );
}

function How({ t }) {
  return (
    <section className="how">
      <div className="container">
        <div className="sec-head">
          <div className="sec-kicker">{t.how.kicker}</div>
          <h2 className="sec-title">{t.how.title}</h2>
        </div>
        <div className="steps">
          {t.how.steps.map((s,i)=>(
            <div className="step" key={i}>
              <div className="step-num">0{i+1}</div>
              <div className="step-title">{s.t}</div>
              <div className="step-text">{s.d}</div>
            </div>
          ))}
        </div>
        <p className="note">{t.how.note}</p>
      </div>
    </section>
  );
}

function Footer({ t }) {
  return (
    <footer className="footer" id="footer">
      <div className="container">
        <div className="footer-grid">
          <div className="footer-brand">
            <a className="logo" href={PORTFOLIO}>
              <span className="logo-mark">{ico.spark}</span><span>AI&nbsp;Vibes</span>
            </a>
            <p className="footer-tag">{t.footer.tag}</p>
          </div>
          <div className="footer-cols">
            <div className="footer-col">
              <h4>{t.footer.contacts}</h4>
              <a href={TG} target="_blank" rel="noopener noreferrer">{ico.tg}Telegram @lavr5000</a>
              <a href={"mailto:"+EMAIL}>{ico.mail}{EMAIL}</a>
            </div>
            <div className="footer-col">
              <h4>{t.footer.nav}</h4>
              <a href={PORTFOLIO}>{t.footer.portfolio}</a>
              <a href="#products">{t.footer.products}</a>
            </div>
          </div>
        </div>
        <div className="footer-bottom">
          <a className="back-link" href={PORTFOLIO}>{ico.back}{t.footer.back}</a>
          <span className="copy">© 2026 AI Vibes · {t.footer.rights}</span>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const [lang, setLang] = useState("ru");
  const t = i18n[lang];
  React.useEffect(()=>{ document.documentElement.lang = lang; }, [lang]);
  return (
    <React.Fragment>
      <Nav lang={lang} setLang={setLang} t={t} />
      <main>
        <Hero t={t} />
        <Products t={t} lang={lang} />
        <How t={t} />
      </main>
      <Footer t={t} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
