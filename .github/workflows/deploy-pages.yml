name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Repository-only paths (tests/ with the dev-only text-layer harness and its PDF
      # fixtures, docs/, scripts/, the repo README and map) are used locally and by other
      # workflows and must not be part of the public site. The list lives in
      # .github/pages-drop.txt; this drops those paths from the deploy artifact only —
      # the repository keeps them. `tr` strips a stray CR so a Windows line ending can
      # never turn a path into a no-op. Note: assets/textlayer-check.js is a DIFFERENT
      # file, imported by assets/order-flow.js at runtime; it stays.
      - name: Drop dev-only pages from the published artifact
        run: tr -d '\r' < .github/pages-drop.txt | grep -v '^#' | xargs -r rm -rf --
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
