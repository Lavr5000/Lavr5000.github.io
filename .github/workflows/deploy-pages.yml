name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/ holds the dev-only text-layer harness page and its PDF fixtures.
      # They are used locally (scripts/test_textlayer.mjs, docs checklist) and must
      # not be part of the public site. This drops them from the deploy artifact
      # only — the repository keeps them. Note: assets/textlayer-check.js is a
      # DIFFERENT file, imported by assets/order-flow.js at runtime; it stays.
      - name: Drop dev-only pages from the published artifact
        run: rm -rf tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
