# Regenerates robots.txt, sitemap.xml, llms.txt and the JSON-LD block when pages change.
# deploy-pages.yml is NOT modified: it is dispatched explicitly, because a commit made with
# GITHUB_TOKEN does not trigger other workflows by push (same pattern as idm-ntd-publish.yml).
# Order matters: the test runs BEFORE anything is committed; a red test or a rebase conflict
# fails the run and nothing reaches master.
name: seo-files

on:
  push:
    branches: [master]
    paths:
      - "**/*.html"
      - "scripts/build_seo_files.py"
      - ".github/workflows/seo-files.yml"
      - "!tests/**"                # paths and paths-ignore cannot be combined: use negation
      - "!idm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-files
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write             # commit regenerated files
      actions: write              # dispatch deploy-pages.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: regenerate
        run: python scripts/build_seo_files.py --write

      - name: test before commit
        run: python tests/seo_files_check.py      # red -> the job stops here, nothing is committed

      - name: commit
        id: commit
        run: |
          git config user.name  "seo-files-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robots.txt sitemap.xml llms.txt index.html services/index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(seo): regenerate robots/sitemap/llms/JSON-LD"
          if ! git pull --rebase origin master; then
            git rebase --abort
            echo "::error::rebase conflict, nothing pushed"
            exit 1
          fi
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"

      # Copied from idm-ntd-publish.yml: `--ref master` resolves to whatever SHA the API reports;
      # wait until it is our commit, otherwise the deploy may rebuild the previous one.
      - name: wait for the branch head to propagate
        if: steps.commit.outputs.changed == '1'
        run: |
          want=$(git rev-parse HEAD)
          for i in $(seq 1 30); do
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" -q .sha)
            [ "$head" = "$want" ] && { echo "master -> $head"; exit 0; }
            echo "  ждём распространения ссылки: master=$head want=$want"
            sleep 5
          done
          echo "::error::branch head did not propagate in 150 s"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: trigger Pages deploy
        if: steps.commit.outputs.changed == '1'
        run: gh workflow run deploy-pages.yml --ref master
        env:
          GH_TOKEN: ${{ github.token }}
